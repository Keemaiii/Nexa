<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa | Outsource Development Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f0f0f;
            --text: #f5f5f5;
            --card: #1a1a1a;
            --card-text: #f5f5f5;
            --primary: #dc2626;
            --primary-text: #ffffff;
            --secondary: #2a2a2a;
            --secondary-text: #d4d4d4;
            --muted: #3a3a3a;
            --muted-text: #9ca3af;
            --accent: #ef4444;
            --border: #2f2f2f;
            --ring: #dc2626;
            --radius: 0.5rem;
        }

        .light-mode {
            --bg: #ffffff;
            --text: #0f0f0f;
            --card: #f5f5f5;
            --card-text: #0f0f0f;
            --primary: #dc2626;
            --primary-text: #ffffff;
            --secondary: #e5e5e5;
            --secondary-text: #333333;
            --muted: #d4d4d4;
            --muted-text: #666666;
            --border: #e5e5e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        .header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        /* 🎯 NEW SINGLE BANNER ROW */
        .header-banner {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* LEFT SIDE: Book Consultation + Clear Chat */
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            justify-content: flex-start;
        }

        .book-header-btn {
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            padding: 0.55rem 1.25rem;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }
        .book-header-btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted-text);
            padding: 0.5rem 0.9rem;
            border-radius: var(--radius);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .clear-btn:hover { 
            background: var(--secondary); 
            color: var(--text); 
        }

        /* CENTER: Medium Logo */
        .header-center {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-link {
            text-decoration: none;
            display: block;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .logo-link:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .company-logo {
            width: 180px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* RIGHT SIDE: Status + Theme Toggle */
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            justify-content: flex-end;
        }

        .status {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            position: relative;
        }
        
        .status-dot.pulse-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: pulse-ring 1.5s ease-out infinite;
        }

        .theme-toggle {
            background: var(--secondary);
            border: 2px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .theme-toggle:hover { 
            border-color: var(--primary); 
            color: var(--primary);
            transform: scale(1.05);
        }

        /* REST OF STYLES REMAIN THE SAME */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            scroll-behavior: smooth;
        }
        
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { 
            background: var(--muted); 
            border-radius: 3px; 
        }
        .messages::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .message {
            display: flex;
            gap: 1.25rem;
            max-width: 90%;
            animation: slide-up 0.25s ease forwards;
        }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            flex-shrink: 0;
            object-fit: cover;
        }

        .bubble {
            background: var(--card);
            color: var(--card-text);
            padding: 1.125rem 1.5rem;
            border-radius: calc(var(--radius) * 2);
            border: 1px solid var(--border);
            line-height: 1.6;
            font-size: 1rem;
        }
        .user .bubble {
            background: var(--primary);
            color: var(--primary-text);
            border-color: var(--primary);
        }

        .voice-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
            padding: 0.5rem;
        }
        .voice-btn:hover { 
            opacity: 1; 
            color: var(--primary); 
        }

        .chips-container { padding: 0 2.5rem 1.5rem; }
        .chips-label { 
            color: var(--muted-text); 
            font-size: 0.875rem; 
            font-weight: 500; 
            margin-bottom: 1rem; 
            font-family: 'JetBrains Mono', monospace; 
        }
        .chips { 
            display: flex; 
            gap: 0.75rem; 
            flex-wrap: wrap; 
        }
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.625rem 1.25rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chip:hover { 
            background: var(--primary); 
            color: var(--primary-text); 
            border-color: var(--primary); 
            transform: translateY(-2px);
        }

        .input-area {
            padding: 1.75rem 2.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            background: var(--card);
            align-items: center;
        }
        .input-wrapper { 
            flex: 1; 
            position: relative; 
            display: flex; 
            align-items: center; 
        }
        
        .mic-btn {
            position: absolute;
            left: 1rem;
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--muted-text);
            transition: 0.2s;
        }
        .mic-btn:hover { color: var(--primary); }
        
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem 1.25rem 1rem 3rem;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 2px var(--ring);
        }
        input::placeholder { color: var(--muted-text); }
        
        .send-btn {
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover { background: var(--accent); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-footer {
            padding: 0.75rem 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted-text);
            border-top: 1px solid var(--border);
            background: var(--card);
            line-height: 1.4;
        }
        .chat-footer strong {
            color: var(--text);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) * 2);
            width: 90%;
            max-width: 700px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { 
            margin: 0; 
            color: var(--text); 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1.5rem; 
        }
        .close-modal {
            background: none; 
            border: none; 
            color: var(--muted-text); 
            font-size: 1.75rem; 
            cursor: pointer; 
            line-height: 1;
        }
        .close-modal:hover { color: var(--primary); }
        .modal-body { flex: 1; }
        .modal-body iframe { width: 100%; height: 100%; border: none; }

        /* 📱 MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .header { padding: 1rem 1.25rem; }
            .company-logo { width: 120px; }
            .book-header-btn { padding: 0.45rem 0.9rem; font-size: 0.78rem; }
            .clear-btn { padding: 0.4rem 0.7rem; font-size: 0.75rem; }
            .theme-toggle { width: 38px; height: 38px; font-size: 1.1rem; }
            .status { font-size: 0.7rem; }
            .header-right { gap: 0.6rem; }
            .messages { padding: 1.5rem; gap: 1.25rem; }
            .message { max-width: 95%; gap: 0.75rem; }
            .avatar { width: 36px; height: 36px; font-size: 1.15rem; }
            .bubble { padding: 1rem 1.25rem; font-size: 0.925rem; }
            .chips-container { padding: 0 1.5rem 1rem; }
            .chip { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .input-area { padding: 1.25rem 1.5rem; }
            input { padding: 0.875rem 1rem 0.875rem 2.75rem; }
            .chat-footer { padding: 0.75rem 1rem; font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .clear-btn { display: none; }
            .status { display: none; }
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 🎯 NEW HEADER BANNER -->
        <div class="header">
            <div class="header-banner">
                
                <!-- LEFT: Book Consultation + Clear Chat -->
                <div class="header-left">
                    <button class="book-header-btn" onclick="openModal()">
                        📅 Book Consultation
                    </button>
                    <button class="clear-btn" onclick="clearChat()">Clear</button>
                </div>
                
                <!-- CENTER: Medium Logo -->
                <div class="header-center">
                    <a href="https://outsourcedevelopment.org" target="_blank" rel="noopener noreferrer" class="logo-link" title="Visit Outsource Development Studio Website">
                        <img src="/assets/logo.png" 
                             alt="Outsource Development Studio Logo" 
                             class="company-logo"
                             onerror="this.style.display='none';">
                    </a>
                </div>
                
                <!-- RIGHT: Status + Theme Toggle -->
                <div class="header-right">
                    <div class="status">
                        <span class="status-dot pulse-ring"></span>
                        ONLINE
                    </div>
                    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme" id="themeBtn">🌙</button>
                </div>
                
            </div>
        </div>

        <div class="messages chat-scroll" id="messages">
            <div class="message bot">
                <img src="/assets/bot-avatar.png" 
                     alt="Nexa Bot" 
                     class="avatar"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="avatar" style="display:none;">🤖</div>
                
                <div class="bubble">Hello! I'm <strong>Nexa</strong>. I can help you with Outsource Development Studio's Services. What would you like to know?</div>
            </div>
        </div>

        <div class="chips-container">
            <div class="chips-label">Try asking:</div>
            <div class="chips">
                <button class="chip" onclick="send('What is BPO and how can it help my business?')">💼 What is BPO?</button>
                <button class="chip" onclick="send('Tell me about recruitment and EOR services')">👥 Recruitment</button>
                <button class="chip" onclick="send('What training seminars do you offer?')">🎓 UWI Training</button>
                <button class="chip" onclick="send('What logistics services do you provide?')">🚚 Logistics</button>
                <button class="chip" onclick="send('Tell me about resilience planning')">🌱 Resilience</button>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Speak">🎙️</button>
                <input type="text" id="input" placeholder="Message Nexa..." onkeypress="if(event.key==='Enter') sendMsg()">
            </div>
            <button class="send-btn" onclick="sendMsg()" id="sendBtn">Send</button>
        </div>

        <div class="chat-footer">
            <p>⚠️ <strong>Disclaimer:</strong> AI is not always accurate and humans must verify the information. | 🇩🇲 <strong>ECCU Camp 2026</strong></p>
        </div>
    </div>

    <!-- 📅 JOTFORM MODAL -->
    <div class="modal-overlay" id="jotformModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📅 Book a Consultation</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <iframe src="https://form.jotform.com/262113198505050" title="Jotform Booking"></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "/chat"; 
        let isListening = false;
        let recognition;

        const localKnowledge = {
            "bpo": {
                keywords: ["bpo", "outsourcing", "business process"],
                response: "Business Process Outsourcing (BPO) is when a company hires experts to handle specific tasks like customer service, data entry, or administrative work. Outsource Development Studio helps businesses in Dominica and across the Caribbean streamline their operations, reduce costs, and focus on what they do best—growing their business! 💼"
            },
            "recruitment": {
                keywords: ["recruitment", "hire", "talent", "eor", "employee"],
                response: "Our recruitment services help you find the perfect talent for your team. We also offer Employer of Record (EOR) services, which means we can legally hire and manage employees on your behalf in Dominica—handling payroll, benefits, and compliance so you don't have to worry about the paperwork! 👥"
            },
            "training": {
                keywords: ["training", "seminar", "uwi", "cave hill", "course"],
                response: "We partner with the UWI Cave Hill School of Business to offer quarterly corporate training seminars! These programs are designed to upskill your team in leadership, management, and business strategy. It's a unique offering that sets Outsource Development Studio apart from other consultancies. 🎓"
            },
            "logistics": {
                keywords: ["logistics", "trucking", "import", "export", "supply chain"],
                response: "Our logistics division handles trucking, import-export services, and supply chain management across Dominica. Whether you need to move goods locally or manage international shipments, we ensure your products get where they need to go—on time and efficiently! 🚚"
            },
            "resilience": {
                keywords: ["resilience", "sustainability", "climate", "disaster"],
                response: "We specialize in resilience and sustainability planning to help businesses prepare for climate challenges and natural disasters. Our team develops business continuity plans that keep your operations running smoothly, even when hurricanes or other disruptions hit. It's about building a future-proof business! 🌱"
            },
            "consulting": {
                keywords: ["consulting", "strategy", "advice", "consultation"],
                response: "Our strategic consulting services provide one-on-one expert guidance to help your business grow. From market analysis to operational improvements, we work closely with you to develop actionable strategies. Ready to get started? Click 'Book Consultation' to schedule a meeting with our team! 📊"
            },
            "booking": {
                keywords: ["book", "appointment", "consultation", "meeting", "schedule"],
                response: "Great! To book a consultation, simply click the '📅 Book Consultation' button at the top, and our team will get back to you within 24 hours to schedule your meeting! 📅"
            },
            "about": {
                keywords: ["about", "who are you", "company", "dominica"],
                response: "Outsource Development Studio is a full-service consultancy based in Roseau, Dominica, with over 15 years of experience. We help businesses across the Caribbean with BPO, recruitment, training, logistics, resilience planning, and strategic consulting. Our mission is to empower businesses to grow sustainably and efficiently! 🏢"
            }
        };

        function checkLocalKnowledge(message) {
            const lowerMessage = message.toLowerCase();
            for (const [key, data] of Object.entries(localKnowledge)) {
                for (const keyword of data.keywords) {
                    if (lowerMessage.includes(keyword)) {
                        return data.response;
                    }
                }
            }
            return null;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('nexa-theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('nexa-theme') === 'light') toggleTheme();

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onresult = (event) => {
                document.getElementById("input").value = event.results[0][0].transcript;
                toggleMic();
                sendMsg();
            };
            recognition.onerror = () => toggleMic();
        }

        function toggleMic() {
            if (!recognition) { 
                alert("Voice input not supported in this browser. Try Chrome or Edge!"); 
                return; 
            }
            const btn = document.getElementById("micBtn");
            const input = document.getElementById("input");
            if (isListening) {
                recognition.stop(); 
                isListening = false;
                btn.style.color = "var(--muted-text)";
                input.style.borderColor = "var(--border)";
                input.placeholder = "Message Nexa...";
            } else {
                recognition.start(); 
                isListening = true;
                btn.style.color = "var(--primary)";
                input.style.borderColor = "var(--primary)";
                input.placeholder = "Listening...";
            }
        }

        function openModal() { 
            document.getElementById("jotformModal").style.display = "flex"; 
        }
        function closeModal() { 
            document.getElementById("jotformModal").style.display = "none"; 
        }

        function send(text) { 
            document.getElementById("input").value = text; 
            sendMsg(); 
        }
        
        function clearChat() {
            document.getElementById("messages").innerHTML = `
                <div class="message bot">
                    <img src="/assets/bot-avatar.png" 
                         alt="Nexa Bot" 
                         class="avatar"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="avatar" style="display:none;">🤖</div>
                    <div class="bubble">Hello! I'm <strong>Nexa</strong>. I can help you with Outsource Development Studio's Services. What would you like to know?</div>
                </div>`;
        }

        async function sendMsg() {
            const input = document.getElementById("input");
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, "user");
            input.value = "";
            
            const btn = document.getElementById("sendBtn");
            btn.disabled = true; 
            btn.innerHTML = "<span style='font-size:1.2rem'>⏳</span>";

            const loadingId = addMessage("Thinking...", "bot", true);
            const localResponse = checkLocalKnowledge(msg);
            
            if (localResponse) {
                setTimeout(() => {
                    removeMessage(loadingId);
                    addMessage(localResponse, "bot", false);
                    btn.disabled = false; 
                    btn.textContent = "Send";
                }, 800);
            } else {
                try {
                    const res = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: msg })
                    });
                    const data = await res.json();
                    removeMessage(loadingId);
                    addMessage(data.response, "bot", false);
                } catch (err) {
                    removeMessage(loadingId);
                    addMessage("I'd love to help with that! For now, try clicking one of the quick buttons above to learn about our services, or click 'Book Consultation' at the top to speak with our team directly. 🤖", "bot");
                } finally {
                    btn.disabled = false; 
                    btn.textContent = "Send";
                }
            }
        }

        function addMessage(text, sender, isLoading = false) {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            const id = Date.now();
            div.id = `msg-${id}`;
            
            const safeText = text.replace(/"/g, '&quot;').replace(/\n/g, ' ');
            const voiceBtn = (sender === "bot" && !isLoading) ? 
                `<button class="voice-btn" onclick="speakText(this)" data-text="${safeText}" title="Listen">🔊</button>` : '';

            const avatarImg = sender === "bot" ? "/assets/bot-avatar.png" : "/assets/user-avatar.png";
            const fallbackEmoji = sender === "bot" ? "🤖" : "👤";

            div.innerHTML = `
                <img src="${avatarImg}" 
                     alt="${sender} avatar" 
                     class="avatar"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="avatar" style="display:none;">${fallbackEmoji}</div>
                <div class="bubble" style="${isLoading ? 'opacity:0.6' : ''}">
                    ${text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>")}
                </div>
                ${voiceBtn}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(`msg-${id}`);
            if (el) el.remove();
        }

        function speakText(buttonElement) {
            window.speechSynthesis.cancel();
            const rawText = buttonElement.getAttribute("data-text");
            const cleanText = rawText.replace(/<[^>]*>/g, "").replace(/\*\*/g, "");
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB'));
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = () => { 
            window.speechSynthesis.getVoices(); 
        };
    </script>
</body>
</html>
