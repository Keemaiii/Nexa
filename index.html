<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa | Outsource Development Studio</title>
    <style>
        /* SLEEK DARK MODE STYLES */
        :root { --bg: #0a0a0a; --bubble: #141414; --text: #f0f0f0; --accent: #a01919; --border: #2a2a2a; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 2rem; text-align: center; border-bottom: 1px solid var(--border); }
        .header h1 { color: #fff; font-size: 2rem; margin: 0; }
        .header p { color: #888; margin-top: 0.5rem; }
        .status { color: #4ade80; font-size: 0.85rem; font-weight: bold; }
        .messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { display: flex; gap: 0.8rem; max-width: 80%; animation: fadeIn 0.3s ease; }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; background: var(--bubble); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .bubble { background: var(--bubble); padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border); line-height: 1.5; white-space: pre-wrap; }
        .user .bubble { background: #1a1a1a; border-color: #333; }
        .input-area { padding: 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.8rem; background: var(--bg); }
        input { flex: 1; background: var(--bubble); border: 1px solid var(--border); color: var(--text); padding: 0.8rem 1rem; border-radius: 12px; font-size: 1rem; outline: none; }
        input:focus { border-color: #fff; }
        button { background: #fff; color: var(--bg); border: none; padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent); color: #fff; }
        .chips { padding: 0 1.5rem 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .chip { background: var(--bubble); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
        .chip:hover { background: #fff; color: var(--bg); border-color: #fff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
        </head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>🇩🇲 Nexa</h1>
            <p>Your intelligent guide to Outsource Development Studio</p>
            <div class="status">● ONLINE · AI SERVICE NAVIGATOR</div>
        </div>

        <div class="messages" id="messages">
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="bubble">Hello! I'm <strong>Nexa</strong> 💛 Ask me about BPO, recruitment, training, logistics, resilience planning, or consulting!</div>
            </div>
        </div>

        <div class="chips">
            <button class="chip" onclick="send('What is BPO?')">What is BPO?</button>
            <button class="chip" onclick="send('Tell me about UWI seminars')">UWI Seminars</button>
            <button class="chip" onclick="send('How do I book a consultation?')">Book Consultation</button>
        </div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Type your question here..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // 🌐 OPTION A MAGIC: Relative URL means it talks to the SAME server hosting this HTML!
        const API_URL = "/chat"; 

        function send(text) {
            document.getElementById("input").value = text;
            sendMsg();
        }

        async function sendMsg() {
            const input = document.getElementById("input");
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, "user");
            input.value = "";
            
            const btn = document.getElementById("sendBtn");
            btn.disabled = true;
            btn.textContent = "...";

            const loadingId = addMessage("Thinking... 🤔", "bot", true);

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                removeMessage(loadingId);
                addMessage(data.response, "bot");
            } catch (err) {
                removeMessage(loadingId);
                addMessage("😅 Oops! Connection error. Please try again.", "bot");
            } finally {
                btn.disabled = false;
                btn.textContent = "Send";
            }
        }

        function addMessage(text, sender, isLoading = false) {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            const id = Date.now();
            div.id = `msg-${id}`;
            div.innerHTML = `
                <div class="avatar">${sender === "bot" ? "🤖" : "👤"}</div>
                <div class="bubble" style="${isLoading ? 'opacity:0.6' : ''}">${text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>")}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(`msg-${id}`);
            if (el) el.remove();
        }
    </script>
</body>
</html>
