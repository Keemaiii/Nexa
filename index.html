<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa | Outsource Development Studio</title>
    <style>
        /* 🎨 DYNAMIC THEME VARIABLES (Defaults to "Warm") */
        :root {
            --bg: #0a0a0a; --bubble: #141414; --text: #f0f0f0; 
            --accent: #D4AF37; /* Gold for Warm */
            --border: #2a2a2a; --success: #4ade80;
        }
        /* Register Themes */
        [data-register="urgent"] { --accent: #ef4444; } /* Red */
        [data-register="bereaved"] { --accent: #64748b; } /* Muted Slate */
        [data-register="professional"] { --accent: #3b82f6; } /* Blue */

        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; height: 100vh; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        
        .header { padding: 1.5rem; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, var(--bubble), var(--bg)); }
        .header h1 { color: #fff; font-size: 1.8rem; margin: 0; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .status { color: var(--success); font-size: 0.8rem; font-weight: bold; margin-top: 0.5rem; letter-spacing: 1px; }

        .messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
        .message { display: flex; gap: 0.8rem; max-width: 85%; animation: slideUp 0.3s ease; }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; background: var(--bubble); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .bubble { background: var(--bubble); padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border); line-height: 1.6; white-space: pre-wrap; position: relative; }
        .user .bubble { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
        
        /* Voice Button */
        .voice-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: 0.6; transition: 0.2s; padding: 0.5rem; }
        .voice-btn:hover { opacity: 1; transform: scale(1.1); }

        .input-area { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.8rem; background: var(--bg); align-items: center; }
        input { flex: 1; background: var(--bubble); border: 1px solid var(--border); color: var(--text); padding: 0.8rem 1rem; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); }
        
        .action-btn { background: var(--accent); color: #000; border: none; padding: 0.8rem; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { filter: brightness(1.1); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .chips { padding: 0 1.5rem 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .chip { background: var(--bubble); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .chip:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* Modal for Jotform */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 600px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; animation: zoomIn 0.3s ease; }
        .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .close-modal { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
        .modal-body { flex: 1; }
        .modal-body iframe { width: 100%; height: 100%; border: none; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        /* Mic listening animation */
        .listening { animation: pulse 1.5s infinite; border-color: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    are: 0; } }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer" data-register="warm">
        <div class="header">
            <h1>🇩🇲 Nexa</h1>
            <p style="color: #888; margin: 0.2rem 0 0; font-size: 0.9rem;">Your intelligent guide to Outsource Development Studio</p>
            <div class="status">● ONLINE · AI SERVICE NAVIGATOR</div>
        </div>

        <div class="messages" id="messages">
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="bubble">Hello! I'm <strong>Nexa</strong> 💛 Ask me about BPO, recruitment, training, logistics, resilience planning, or consulting!</div>
            </div>
        </div>

        <div class="chips">
            <button class="chip" onclick="send('What is BPO?')">💼 What is BPO?</button>
            <button class="chip" onclick="send('Tell me about UWI seminars')">🎓 UWI Seminars</button>
            <button class="chip" onclick="openModal()">📅 Book Consultation</button>
        </div>

        <div class="input-area">
            <button class="action-btn" id="micBtn" onclick="toggleMic()" title="Speak">🎙️</button>
            <input type="text" id="input" placeholder="Type or speak your question..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="action-btn" onclick="sendMsg()" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- 📅 SEAMLESS JOTFORM MODAL -->
    <div class="modal-overlay" id="jotformModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0">📅 Book a Consultation</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <!-- Replace with your actual Jotform URL -->
                <iframe src="https://form.jotform.com/262112347700850" title="Jotform Booking"></iframe>
            </div
        </div>
    </div>

    <script>
        const API_URL = "/chat"; 
        let isListening = false;
        let recognition;

        // 🎙️ DAY 12 INTEGRATION: Browser Native Speech-to-Text
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onresult = (event) => {
                document.getElementById("input").value = event.results[0][0].transcript;
                toggleMic(); // Stop listening
                sendMsg();   // Auto-send
            };
            recognition.onerror = () => toggleMic();
        }

        function toggleMic() {
            if (!recognition) { alert("Voice input not supported in this browser."); return; }
            const btn = document.getElementById("micBtn");
            const input = document.getElementById("input");
            if (isListening) {
                recognition.stop();
                isListening = false;
                btn.style.background = "none";
                input.classList.remove("listening");
            } else {
                recognition.start();
                isListening = true;
                btn.style.background = "rgba(239, 68, 68, 0.2)";
                input.classList.add("listening");
                input.placeholder = "Listening...";
            }
        }

        function openModal() { document.getElementById("jotformModal").style.display = "flex"; }
        function closeModal() { document.getElementById("jotformModal").style.display = "none"; }

        function send(text) { document.getElementById("input").value = text; sendMsg(); }

        async function sendMsg() {
            const input = document.getElementById("input");
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, "user");
            input.value = "";
            
            const btn = document.getElementById("sendBtn");
            btn.disabled = true; btn.textContent = "...";

            const loadingId = addMessage("Thinking... 🤔", "bot", true);

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                removeMessage(loadingId);
                addMessage(data.response, "bot", false, data.register);
                
                // 🎨 DYNAMIC THEME: Change UI accent color based on detected register!
                document.getElementById("chatContainer").setAttribute("data-register", data.register || "warm");
            } catch (err) {
                removeMessage(loadingId);
                addMessage("😅 Oops! Connection error. Please try again.", "bot");
            } finally {
                btn.disabled = false; btn.textContent = "Send";
            }
        }

        function addMessage(text, sender, isLoading = false, register = "warm") {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            const id = Date.now();
            div.id = `msg-${id}`;
            
            // 🔊 DAY 12 INTEGRATION: Text-to-Speech button for bot messages
            const voiceBtn = (sender === "bot" && !isLoading) ? 
                `<button class="voice-btn" onclick="speakText('${text.replace(/'/g, "\\'")}')" title="Listen">🔊</button>` : '';

            div.innerHTML = `
                <div class="avatar">${sender === "bot" ? "🤖" : "👤"}</div>
                <div class="bubble" style="${isLoading ? 'opacity:0.6' : ''}">
                    ${text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>")}
                </div>
                ${voiceBtn}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(`msg-${id}`);
            if (el) el.remove();
        }

        // 🔊 DAY 12 INTEGRATION: Browser Native Text-to-Speech
        function speakText(text) {
            // Strip markdown for cleaner speech
            const cleanText = text.replace(/\*\*/g, "").replace(/<br>/g, ". ");
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
