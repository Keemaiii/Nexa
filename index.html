<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa | Outsource Development Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f0f0f;
            --text: #f5f5f5;
            --card: #1a1a1a;
            --card-text: #f5f5f5;
            --primary: #dc2626;
            --primary-text: #ffffff;
            --secondary: #2a2a2a;
            --secondary-text: #d4d4d4;
            --muted: #3a3a3a;
            --muted-text: #9ca3af;
            --accent: #ef4444;
            --border: #2f2f2f;
            --ring: #dc2626;
            --radius: 0.5rem;
        }

        .light-mode {
            --bg: #ffffff;
            --text: #0f0f0f;
            --card: #f5f5f5;
            --card-text: #0f0f0f;
            --primary: #dc2626;
            --primary-text: #ffffff;
            --secondary: #e5e5e5;
            --secondary-text: #333333;
            --muted: #d4d4d4;
            --muted-text: #666666;
            --border: #e5e5e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            position: relative; /* Needed for absolute positioning of floating button */
        }

        .header {
            padding: 2rem 2.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 2.25rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }
        
        .header p {
            color: var(--muted-text);
            font-size: 1rem;
            text-align: center;
            max-width: 600px;
        }

        /* 🔗 HYPERLINKED LOGO STYLES */
        .logo-link {
            text-decoration: none;
            display: block;
            margin: 0 auto 1rem auto;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .logo-link:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .company-logo {
            max-width: 140px;
            height: auto;
            display: block;
        }

        .header-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }

        .status {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            position: relative;
        }
        
        .status-dot.pulse-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: pulse-ring 1.5s ease-out infinite;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted-text);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .clear-btn:hover { 
            background: var(--secondary); 
            color: var(--text); 
        }

        /* 🌙 LARGER THEME TOGGLE BUTTON */
        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            background: var(--secondary);
            border: 2px solid var(--border);
            color: var(--text);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .theme-toggle:hover { 
            border-color: var(--primary); 
            color: var(--primary);
            transform: scale(1.05);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            scroll-behavior: smooth;
        }
        
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { 
            background: var(--muted); 
            border-radius: 3px; 
        }
        .messages::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .message {
            display: flex;
            gap: 1.25rem;
            max-width: 90%;
            animation: slide-up 0.25s ease forwards;
        }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            flex-shrink: 0;
            object-fit: cover;
        }

        .bubble {
            background: var(--card);
            color: var(--card-text);
            padding: 1.125rem 1.5rem;
            border-radius: calc(var(--radius) * 2);
            border: 1px solid var(--border);
            line-height: 1.6;
            font-size: 1rem;
        }
        .user .bubble {
            background: var(--primary);
            color: var(--primary-text);
            border-color: var(--primary);
        }

        .voice-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
            padding: 0.5rem;
        }
        .voice-btn:hover { 
            opacity: 1; 
            color: var(--primary); 
        }

        .chips-container { padding: 0 2.5rem 1.5rem; }
        .chips-label { 
            color: var(--muted-text); 
            font-size: 0.875rem; 
            font-weight: 500; 
            margin-bottom: 1rem; 
            font-family: 'JetBrains Mono', monospace; 
        }
        .chips { 
            display: flex; 
            gap: 0.75rem; 
            flex-wrap: wrap; 
        }
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.625rem 1.25rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chip:hover { 
            background: var(--primary); 
            color: var(--primary-text); 
            border-color: var(--primary); 
            transform: translateY(-2px);
        }

        .input-area {
            padding: 1.75rem 2.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            background: var(--card);
            align-items: center;
        }
        .input-wrapper { 
            flex: 1; 
            position: relative; 
            display: flex; 
            align-items: center; 
        }
        
        .mic-btn {
            position: absolute;
            left: 1rem;
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--muted-text);
            transition: 0.2s;
        }
        .mic-btn:hover { color: var(--primary); }
        
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem 1.25rem 1rem 3rem;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 2px var(--ring);
        }
        input::placeholder { color: var(--muted-text); }
        
        .send-btn {
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover { background: var(--accent); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 📅 FLOATING BOOK CONSULTATION BUTTON (LEFT SIDE) */
        .book-fab {
            position: absolute;
            bottom: 110px; /* Positioned just above the input area */
            left: 20px;
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            border-radius: 50px;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            transition: all 0.2s ease;
            z-index: 10;
        }
        .book-fab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
            background: var(--accent);
        }

        /* ⚠️ FOOTER DISCLAIMER */
        .chat-footer {
            padding: 0.75rem 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted-text);
            border-top: 1px solid var(--border);
            background: var(--card);
            line-height: 1.4;
        }
        .chat-footer strong {
            color: var(--text);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) * 2);
            width: 90%;
            max-width: 700px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { 
            margin: 0; 
            color: var(--text); 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1.5rem; 
        }
        .close-modal {
            background: none; 
            border: none; 
            color: var(--muted-text); 
            font-size: 1.75rem; 
            cursor: pointer; 
            line-height: 1;
        }
        .close-modal:hover { color: var(--primary); }
        .modal-body { flex: 1; }
        .modal-body iframe { width: 100%; height: 100%; border: none; }

        /* 📱 MOBILE RESPONSIVE ADJUSTMENTS */
        @media (max-width: 768px) {
            .header { padding: 1.5rem 1.5rem; }
            .header h1 { font-size: 1.75rem; }
            .header p { font-size: 0.875rem; }
            .company-logo { max-width: 100px; }
            .theme-toggle {
                width: 42px; height: 42px; font-size: 1.25rem;
                top: 1.5rem; right: 1.5rem;
            }
            .messages { padding: 1.5rem; gap: 1.25rem; }
            .message { max-width: 95%; gap: 0.75rem; }
            .avatar { width: 36px; height: 36px; font-size: 1.15rem; }
            .bubble { padding: 1rem 1.25rem; font-size: 0.925rem; }
            .chips-container { padding: 0 1.5rem 1rem; }
            .chip { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .input-area { padding: 1.25rem 1.5rem; }
            input { padding: 0.875rem 1rem 0.875rem 2.75rem; }
            
            /* Adjust floating button for mobile */
            .book-fab {
                bottom: 100px;
                left: 15px;
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }
            .chat-footer { padding: 0.75rem 1rem; font-size: 0.7rem; }
        }

            0% { transform: scale(1); opacity: 1; }
            100%
